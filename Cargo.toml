[workspace]
members = [
    "crates/logging",
    "crates/id",
    "crates/text",
    "crates/semantic",
    "crates/vt",
    "crates/vcs",
    "crates/bgpool",
    "crates/scheduler",
    "crates/snippet",
    "crates/icons",
    "crates/fs",
    "crates/session",
    "crates/util",
    "crates/event",
    "crates/keymap",
    "crates/extension",
    "crates/net",
    "crates/clipboard",
]
resolver = "3"

[package]
name = "magma"
version = "0.1.0"
edition = "2024"
description = "A programmable text editor – Rust kernel, Janet userland"

[dependencies]
logging = { path = "crates/logging" }
id = { path = "crates/id" }
text = { path = "crates/text" }
semantic = { path = "crates/semantic" }
vt = { path = "crates/vt" }
vcs = { path = "crates/vcs" }
bgpool = { path = "crates/bgpool" }
scheduler = { path = "crates/scheduler" }
snippet = { path = "crates/snippet" }
icons = { path = "crates/icons" }
fs = { path = "crates/fs" }
session = { path = "crates/session" }
util = { path = "crates/util" }
event = { path = "crates/event" }
keymap = { path = "crates/keymap" }
extension = { path = "crates/extension" }
net = { path = "crates/net" }
clipboard = { path = "crates/clipboard" }
anyhow = "1.0"
thiserror = "1.0"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
smallstr = "0.3"
slab = "0.4"
ropey = "1.6"
eframe = { version = "0.36.2", optional = true, features = ["wgpu"] }
bytemuck = { version = "1", optional = true }
ab_glyph = { version = "0.2", optional = true }
rfd = { version = "0.15", optional = true }
resvg = { version = "0.45", optional = true }
evil-janet = { version = "1.37", features = ["link-amalg"], optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
notify = "7.0"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
libloading = "0.8"
ureq = "2"
unicode-bidi = "0.3"

[dev-dependencies]
paste = "1.0"

[[bench]]
name = "buffer_ops"
harness = false

[[bench]]
name = "frame_pipeline"
harness = false

[[bench]]
name = "rope_ops"
harness = false

[[bench]]
name = "event_bus"
harness = false

[[bench]]
name = "command_dispatch"
harness = false

[[bench]]
name = "keymap_resolution"
harness = false

[[bench]]
name = "surface_ops"
harness = false

[[bench]]
name = "undo_ops"
harness = false

[[bench]]
name = "editor_workloads"
harness = false

[[bench]]
name = "perf_gates"
harness = false

[features]
default = ["janet", "gui"]
janet = ["dep:evil-janet"]
gui = ["dep:eframe", "dep:bytemuck", "dep:ab_glyph", "dep:rfd", "dep:resvg"]
