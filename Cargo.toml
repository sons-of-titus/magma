[workspace]
members = [
    "crates/logging",
    "crates/id",
    "crates/text",
    "crates/semantic",
    "crates/vt",
    "crates/vcs",
    "crates/bgpool",
    "crates/scheduler",
    "crates/snippet",
    "crates/icons",
    "crates/fs",
    "crates/agent",
    "crates/session",
    "crates/index",
    "crates/run_config",
    "crates/project",
    "crates/crash_recovery",
    "crates/tool_diag",
    "crates/debug_model",
    "crates/db",
    "crates/font",
    "crates/view_tree",
    "crates/row_layout",
    "crates/surface",
    "crates/gpu",
    "crates/pty",
    "crates/util",
    "crates/event",
    "crates/keymap",
    "crates/extension",
    "crates/net",
    "crates/clipboard",
    "crates/slint-shell",
    "crates/scripting",
    "crates/kernel",
]
resolver = "3"

[package]
name = "magma"
version = "0.1.0"
edition = "2024"
description = "A programmable text editor – Rust kernel, Janet userland"

[dependencies]
logging = { path = "crates/logging" }
id = { path = "crates/id" }
text = { path = "crates/text" }
semantic = { path = "crates/semantic" }
vt = { path = "crates/vt" }
vcs = { path = "crates/vcs" }
bgpool = { path = "crates/bgpool" }
scheduler = { path = "crates/scheduler" }
snippet = { path = "crates/snippet" }
icons = { path = "crates/icons" }
fs = { path = "crates/fs" }
session = { path = "crates/session" }
index = { path = "crates/index" }
run_config = { path = "crates/run_config" }
project = { path = "crates/project" }
crash_recovery = { path = "crates/crash_recovery" }
tool_diag = { path = "crates/tool_diag" }
debug_model = { path = "crates/debug_model" }
font = { path = "crates/font" }
view_tree = { path = "crates/view_tree" }
row_layout = { path = "crates/row_layout" }
surface = { path = "crates/surface" }
gpu = { path = "crates/gpu" }
pty = { path = "crates/pty" }
util = { path = "crates/util" }
event = { path = "crates/event" }
keymap = { path = "crates/keymap" }
extension = { path = "crates/extension" }
net = { path = "crates/net" }
clipboard = { path = "crates/clipboard" }
kernel = { path = "crates/kernel" }
agent = { path = "crates/agent" }
anyhow = "1.0"
thiserror = "1.0"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
smallstr = "0.3"
slab = "0.4"
ropey = "1.6"
evil-janet = { version = "1.37", features = ["link-amalg"], optional = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
notify = "7.0"
libc = "0.2"
tree-sitter = "0.24"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
libloading = "0.8"
ureq = "2"
unicode-bidi = "0.3"

[dev-dependencies]
paste = "1.0"
ab_glyph = "0.2"
db = { path = "crates/db" }

[[bench]]
name = "buffer_ops"
harness = false

[[bench]]
name = "frame_pipeline"
harness = false

[[bench]]
name = "rope_ops"
harness = false

[[bench]]
name = "event_bus"
harness = false

[[bench]]
name = "command_dispatch"
harness = false

[[bench]]
name = "keymap_resolution"
harness = false

[[bench]]
name = "surface_ops"
harness = false

[[bench]]
name = "undo_ops"
harness = false

[[bench]]
name = "editor_workloads"
harness = false

[[bench]]
name = "perf_gates"
harness = false

[features]
default = ["janet"]
janet = []

[profile.dev.package.slint]
opt-level = 3
[profile.dev.package.i-slint-core]
opt-level = 3
[profile.dev.package.i-slint-renderer-skia]
opt-level = 3
[profile.dev.package.skia-bindings]
opt-level = 3
[profile.dev.package.i-slint-backend-winit]
opt-level = 3
[profile.dev.package.winit]
opt-level = 3
# The editor's CPU render loop (surface blit, glyph atlas, row layout) lives
# in these crates.  At dev opt-level 0 the per-keystroke pane blit is 10-50x
# slower than optimized code and dominates typing/scrolling latency, so they
# must build optimized even in debug builds.
[profile.dev.package.kernel]
opt-level = 3
[profile.dev.package.magma-slint]
opt-level = 3
[profile.dev.package.text]
opt-level = 3
[profile.dev.package.row_layout]
opt-level = 3
[profile.dev.package.gpu]
opt-level = 3
[profile.dev.package.surface]
opt-level = 3
[profile.dev.package.vt]
opt-level = 3
