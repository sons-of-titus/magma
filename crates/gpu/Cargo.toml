[package]
name = "gpu"
version = "0.1.0"
edition = "2024"
description = "Glyph atlas, glyph rasterizer, and wgpu paint callback for Magma's editor pane"

[features]
default = []
gui = ["dep:eframe", "dep:bytemuck", "dep:ab_glyph"]

[dependencies]
surface = { path = "../surface" }
eframe = { version = "0.36.2", optional = true, features = ["wgpu"] }
bytemuck = { version = "1", optional = true }
ab_glyph = { version = "0.2", optional = true }
