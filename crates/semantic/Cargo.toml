[package]
name = "semantic"
version = "0.1.0"
edition = "2024"
description = "Language-intelligence core for Magma: providers, symbols, project graph, tree-sitter"

[dependencies]
util = { path = "../util" }
text = { path = "../text" }
logging = { path = "../logging" }
libloading = "0.8"
serde_json = "1"
streaming-iterator = "0.1"
tokio = { version = "1", features = ["sync"] }
tree-sitter = "0.27"
tree-sitter-language = "0.1"

[dev-dependencies]
cc = "1"
