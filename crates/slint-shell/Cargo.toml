[package]
name = "ui"
version = "0.1.0"
edition = "2024"
description = "Magma's Slint frontend — declarative shell over the kernel's Surface"

[dependencies]
kernel = { path = "../kernel" }
db = { path = "../db" }
logging = { path = "../logging" }
scripting = { path = "../scripting", optional = true }
slint = { version = "=1.18.1", features = ["compat-1-18", "backend-winit", "renderer-skia", "renderer-software", "unstable-fontique-011", "unstable-wgpu-30"] }
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
serde_json = "1"
ab_glyph = "0.2"
fontdb = { version = "0.23", features = ["fs", "memmap"] }

[target.'cfg(target_os = "macos")'.dependencies]
resvg = "0.48"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[features]
default = ["janet"]
janet = ["dep:scripting", "scripting/janet"]

[build-dependencies]
slint-build = "=1.18.1"
