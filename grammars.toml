# Grammar sources for the bundled language plugins.
#
# Each entry names the plugin language id (matching plugins/<id>/ and the
# `:languages` manifest key) and the upstream grammar repository it is
# built from.  `cargo xtask grammars --all` clones each repo at the pinned
# commit and compiles the parser into plugins/<id>/grammars/ as a shared
# library for the running platform.
#
# Fields:
#   repo   upstream grammar repository
#   rev    pinned commit the library is built from
#   src    repo-relative parser directory (default "src"); parser.c plus
#          any scanner.c / scanner.cc in it are compiled automatically
#   extra  additional repo-relative C/C++ sources (shared scanners living
#          outside the parser directory)
#   symbol export override for grammars whose C entry point does not
#          follow the tree_sitter_<language> convention

[grammars.batch]
repo = "https://github.com/wharflab/tree-sitter-batch"
rev = "2aa22f00d7f5bbe58556b8eef0b1fc1629508603"

[grammars.c]
repo = "https://github.com/tree-sitter/tree-sitter-c"
rev = "b780e47fc780ddc8da13afa35a3f4ed5c157823d"

# Skipped: oakmac/tree-sitter-clojure still emits grammar ABI 9, below
# the runtime's minimum (13), and has no regenerated branch.  The clojure
# plugin falls back to the native keyword highlighter.
# [grammars.clojure]
# repo = "https://github.com/oakmac/tree-sitter-clojure"
# rev = "bff93b54c2ccc4c905b0e1cc64be622163c8b7fc"

