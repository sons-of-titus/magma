[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

# Deliberately not a workspace member: the grammar build tool must not
# drag its own dependencies into the editor's dependency graph.

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
libloading = "0.8"
# Windows only for MSVC tool discovery, but kept unconditional: the
# windows code paths are runtime-gated, not compile-gated.
cc = "1"
